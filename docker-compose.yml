services:
  redis:
    image: redis:7-alpine
    container_name: property-dealer-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: property-dealer-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    restart: unless-stopped