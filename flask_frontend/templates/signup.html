
{% extends "base.html" %}

{% block title %}Sign Up · {{ app_name }}{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-card">

        <span class="eyebrow">CREATE ACCOUNT</span>

        <h1>Sign up</h1>

        <p class="auth-subtitle">
            Create an account to manage your property activity.
        </p>

        {% if error %}
            <div class="alert error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <div class="form-group">
                <label>Name</label>
                <input
                    type="text"
                    name="name"
                    placeholder="Your name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >
            </div>

            <button type="submit" class="button primary">
                Create account
            </button>

        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

    </div>
</section>

{% endblock %}
