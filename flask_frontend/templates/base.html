<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        {{ app_name }}
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<header class="navbar">
    <div class="container nav-inner">

        <a href="{{ url_for('home') }}" class="logo">
            Property Dealer AI
        </a>

        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('properties') }}">Properties</a>
            <a href="{{ url_for('search') }}">Search</a>
            <a href="{{ url_for('ai_search_page') }}">AI Search</a>

            {% if session.get("access_token") %}
                <a href="{{ url_for('profile') }}">Profile</a>
                <a href="{{ url_for('logout') }}">Logout</a>
            {% else %}
                <a href="{{ url_for('login') }}">Login</a>
                <a href="{{ url_for('signup') }}">Sign Up</a>
            {% endif %}
        </nav>

    </div>
</header>


<main>
    {% block content %}
    {% endblock %}
</main>


<footer>
    <div class="container">
        <p>
            Property Dealer AI · Powered by FastAPI
        </p>
    </div>
</footer>


<script
    src="{{ url_for('static', filename='js/app.js') }}"
></script>

</body>
</html>
